        {
          id: 48,
          category: "Execution",
          question: "How do you handle a situation where engineering and design fundamentally disagree?",

            "First, I make sure I understand both sides deeply—often disagreements stem from different assumptions or incomplete information sharing. Then I find common ground: what's the shared goal? Usually it's user value or business outcome, and we can work backward from there. I look for creative solutions that satisfy both constraints—often the best answer isn't either proposal but a third option. But sometimes there's no reconciliation, and the PM has to make the call. I'd decide based on what's best for users and the business, communicate my reasoning, and own the outcome. What I never do: let the disagreement fester or pick sides without understanding both.",

      const categories = [
        { id: "all", name: "All Topics", icon: "🎯" },
        { id: "Metrics", name: "Metrics & Analytics", icon: "📊" },
        { id: "Strategy", name: "Product Strategy", icon: "🎯" },
        { id: "Technical", name: "Technical Depth", icon: "⚙️" },
        { id: "Execution", name: "Execution & Leadership", icon: "🚀" },
      ];

      const seededShuffle = (array, seed) => {
        const shuffled = [...array];
        let currentIndex = shuffled.length;
        const seededRandom = () => {
          seed = (seed * 9301 + 49297) % 233280;
          return seed / 233280;
        };
        while (currentIndex > 0) {
          const randomIndex = Math.floor(seededRandom() * currentIndex);
          currentIndex--;
          [shuffled[currentIndex], shuffled[randomIndex]] = [
            shuffled[randomIndex],
            shuffled[currentIndex],
          ];
        }
        return shuffled;
      };

      const computeAutoRating = (answer, keyPoints) => {
        if (!answer || !keyPoints || keyPoints.length === 0) {
          return { score: 1, explanation: "No answer or no key points to compare." };
        }
        const lc = answer.toLowerCase();
        const stopwords = new Set([
          "the",
          "and",
          "for",
          "that",
          "with",
          "what",
          "when",
          "how",
          "a",
          "an",
          "to",
          "of",
          "in",
          "is",
          "are",
          "we",
          "i",
        ]);
        const matched = [];
        const missed = [];
        keyPoints.forEach((kp) => {
          const words = kp
            .toLowerCase()
            .split(/[^a-z0-9]+/)
            .filter(Boolean)
            .filter((w) => !stopwords.has(w));
          const found = words.some((w) => w.length > 3 && lc.includes(w));
          if (found) matched.push(kp);
          else missed.push(kp);
        });

        const ratio = matched.length / keyPoints.length;
        const score = Math.max(1, Math.min(5, Math.round(ratio * 4) + 1));

        let explanation = "";
        if (matched.length > 0) {
          explanation +=
            `Matched points (${matched.length}/${keyPoints.length}): ` +
            matched.map((m) => m).join("; ") +
            ".\n\n";
        }
        if (missed.length > 0) {
          explanation +=
            `Missing or weak points (${missed.length}): ` +
            missed.map((m) => m).join("; ") +
            ".\n";
        }
        if (!explanation) explanation = "No clear matches found.";

        return { score, explanation };
      };

      function App() {
        const [gameState, setGameState] = useState("start");
        const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
        const [answers, setAnswers] = useState([]);
        const [currentAnswer, setCurrentAnswer] = useState("");
        const [timeLeft, setTimeLeft] = useState(300);
        const [isTimerRunning, setIsTimerRunning] = useState(false);
        const [scores, setScores] = useState([]);
        const [currentScore, setCurrentScore] = useState(0);
        const [suggestedScores, setSuggestedScores] = useState([]);
        const [suggestedScore, setSuggestedScore] = useState(null);
        const [suggestedExplanation, setSuggestedExplanation] = useState("");
        const [selectedQuestions, setSelectedQuestions] = useState([]);
        const [questionCount, setQuestionCount] = useState(5);
        const [sessionSeed, setSessionSeed] = useState(Date.now());
        const [selectedCategories, setSelectedCategories] = useState(["all"]);

        useEffect(() => {
          let interval = null;
          if (isTimerRunning && timeLeft > 0) {
            interval = setInterval(() => {
              setTimeLeft((time) => time - 1);
            }, 1000);
          } else if (timeLeft === 0) {
            setIsTimerRunning(false);
          }
          return () => clearInterval(interval);
        }, [isTimerRunning, timeLeft]);

        const formatTime = (seconds) => {
          const mins = Math.floor(seconds / 60);
          const secs = seconds % 60;
          return `${mins}:${secs.toString().padStart(2, "0")}`;
        };

        const getFilteredQuestions = () => {
          if (selectedCategories.includes("all")) {
            return allQuestions;
          }
          return allQuestions.filter((q) => selectedCategories.includes(q.category));
        };

        const toggleCategory = (categoryId) => {
          if (categoryId === "all") {
            setSelectedCategories(["all"]);
          } else {
            let newSelection = selectedCategories.filter((c) => c !== "all");
            if (newSelection.includes(categoryId)) {
              newSelection = newSelection.filter((c) => c !== categoryId);
              if (newSelection.length === 0) {
                newSelection = ["all"];
              }
            } else {
              newSelection = [...newSelection, categoryId];
            }
            setSelectedCategories(newSelection);
          }
          setSessionSeed(Date.now());
        };

        const startPractice = () => {
          const newSeed = Date.now();
          setSessionSeed(newSeed);
          const filtered = getFilteredQuestions();
          const shuffled = seededShuffle(filtered, newSeed);
          const selected = shuffled.slice(0, Math.min(questionCount, shuffled.length));
          setSelectedQuestions(selected);
          setCurrentQuestionIndex(0);
          setAnswers([]);
          setScores([]);
          setSuggestedScores([]);
          setCurrentAnswer("");
          setTimeLeft(300);
          setIsTimerRunning(false);
          setGameState("question");
        };

        const reshuffleQuestions = () => {
          setSessionSeed(Date.now());
        };

        const handleStartTimer = () => setIsTimerRunning(true);
        const handlePauseTimer = () => setIsTimerRunning(false);

        const handleSubmitAnswer = () => {
          setIsTimerRunning(false);
          setAnswers([...answers, currentAnswer]);
          const currentQuestion = selectedQuestions[currentQuestionIndex];
          const auto = computeAutoRating(
            currentAnswer,
            currentQuestion?.keyPoints || []
          );
          setSuggestedScore(auto.score);
          setSuggestedExplanation(auto.explanation);
          setGameState("review");
        };

        const handleScoreSubmit = () => {
          setScores([...scores, currentScore]);
          setSuggestedScores([
            ...suggestedScores,
            suggestedScore !== null ? suggestedScore : currentScore,
          ]);
          setSuggestedScore(null);
          setSuggestedExplanation("");
          if (currentQuestionIndex < selectedQuestions.length - 1) {
            setCurrentQuestionIndex(currentQuestionIndex + 1);
            setCurrentAnswer("");
            setCurrentScore(0);
            setTimeLeft(300);
            setGameState("question");
          } else {
            setGameState("results");
          }
        };

        const handleRestart = () => {
          setGameState("start");
          setCurrentQuestionIndex(0);
          setAnswers([]);
          setScores([]);
          setSuggestedScores([]);
          setCurrentAnswer("");
          setTimeLeft(300);
          setIsTimerRunning(false);
          setSessionSeed(Date.now());
        };

        const getScoreColor = (score) => {
          if (score >= 4) return "text-green-600";
          if (score >= 3) return "text-yellow-600";
          return "text-red-600";
        };

        const getScoreBg = (score) => {
          if (score >= 4) return "bg-green-100 border-green-300";
          if (score >= 3) return "bg-yellow-100 border-yellow-300";
          return "bg-red-100 border-red-300";
        };

        const getAverageScore = () => {
          if (scores.length === 0) return 0;
          return (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
        };

        const getTimerColor = () => {
          if (timeLeft > 180) return "text-green-600";
          if (timeLeft > 60) return "text-yellow-600";
          return "text-red-600";
        };

        const filteredQuestions = useMemo(() => getFilteredQuestions(), [selectedCategories]);
        const previewQuestions = seededShuffle(filteredQuestions, sessionSeed).slice(
          0,
          Math.min(questionCount, filteredQuestions.length)
        );

        if (gameState === "start") {
          return (
            <div className="min-h-screen bg-[#f6f3ee] text-slate-900 p-4">
              <div className="max-w-3xl mx-auto">
                <div className="bg-white rounded-2xl shadow-2xl p-8 mb-6">
                  <div className="text-center mb-8">
                    <div className="inline-flex items-center justify-center w-16 h-16 bg-amber-100 rounded-full mb-4 text-3xl">
                      🎯
                    </div>
                    <h1 className="text-3xl font-bold text-gray-800 mb-2">
                      AI PM Interview Practice
                    </h1>
                    <p className="text-gray-600">
                      Senior/Lead PM • AI-Native Startups • LLMs & GenAI
                    </p>
                    <p className="text-sm text-amber-600 mt-2 font-medium">
                      {allQuestions.length} questions • Fresh random mix each session
                    </p>
                  </div>

                  <div className="mb-6">
                    <div className="flex items-center gap-2 mb-3">
                      <span className="text-gray-600">🔍</span>
                      <h3 className="font-semibold text-gray-800">Focus Areas</h3>
                      <span className="text-xs text-gray-500">
                        ({filteredQuestions.length} questions available)
                      </span>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                      {categories.map((cat) => {
                        const isSelected = selectedCategories.includes(cat.id);
                        const count =
                          cat.id === "all"
                            ? allQuestions.length
                            : allQuestions.filter((q) => q.category === cat.id).length;
                        return (
                          <button
                            key={cat.id}
                            onClick={() => toggleCategory(cat.id)}
                            className={`p-3 rounded-xl text-left transition-all border-2 ${
                              isSelected
                                ? "bg-amber-100 border-amber-400 text-amber-900"
                                : "bg-gray-50 border-gray-200 text-gray-600 hover:border-amber-300"
                            }`}
                          >
                            <div className="flex items-center gap-2">
                              <span className="text-lg">{cat.icon}</span>
                              <div className="flex-1 min-w-0">
                                <div className="text-sm font-medium truncate">{cat.name}</div>
                                <div className="text-xs opacity-70">{count} Qs</div>
                              </div>
                              {isSelected && cat.id !== "all" && (
                                <span className="text-gray-500">✕</span>
                              )}
                            </div>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="mb-6">
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Number of questions:
                    </label>
                    <div className="flex gap-2">
                      {[3, 5, 8, 10].map((num) => (
                        <button
                          key={num}
                          onClick={() => setQuestionCount(num)}
                          disabled={num > filteredQuestions.length}
                          className={`flex-1 py-2 rounded-lg font-medium transition-all ${
                            questionCount === num
                              ? "bg-amber-600 text-white"
                              : num > filteredQuestions.length
                              ? "bg-gray-100 text-gray-400 cursor-not-allowed"
                              : "bg-gray-100 text-gray-700 hover:bg-gray-200"
                          }`}
                        >
                          {num}
                        </button>
                      ))}
                    </div>
                    <p className="text-xs text-gray-500 mt-2">
                      Estimated time: {Math.min(questionCount, filteredQuestions.length) * 6}-
                      {Math.min(questionCount, filteredQuestions.length) * 8} minutes
                    </p>
                  </div>

                  <div className="mb-6 bg-gray-50 rounded-xl p-4">
                    <div className="flex items-center justify-between mb-3">
                      <h4 className="text-sm font-medium text-gray-700">
                        Questions for this session:
                      </h4>
                      <button
                        onClick={reshuffleQuestions}
                        className="flex items-center gap-1 text-amber-600 hover:text-amber-700 text-sm font-medium"
                      >
                        🔀 Shuffle
                      </button>
                    </div>
                    {filteredQuestions.length === 0 ? (
                      <p className="text-gray-500 text-sm">
                        No questions match your selected categories.
                      </p>
                    ) : (
                      <ul className="space-y-2">
                        {previewQuestions.map((q, idx) => (
                          <li key={q.id} className="flex items-start gap-2 text-sm">
                            <span className="bg-gray-200 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">
                              {idx + 1}
                            </span>
                            <span className="text-gray-600">
                              <span className="text-amber-600 font-medium">[{q.category}]</span>{" "}
                              {q.question.length > 55

                          </li>
                        ))}
                      </ul>
                    )}
                  </div>

                  <button

                    disabled={filteredQuestions.length === 0}
                    className="w-full bg-amber-600 hover:bg-amber-700 disabled:bg-gray-400 text-white font-semibold py-4 rounded-xl transition-all flex items-center justify-center gap-2 text-lg"
                  >
                    ▶️ Start Practice
                  </button>
                </div>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-[#f6f3ee] text-slate-900 p-4">
              <div className="max-w-4xl mx-auto">
                <div className="flex items-center justify-between mb-6">

                    <button

                      className="flex items-center gap-1 text-amber-700 hover:text-slate-900 transition-colors text-sm"
                    >
                      🏠 Home
                    </button>
                    <span className="text-amber-500">|</span>
                    <span className="bg-amber-600 text-white px-3 py-1 rounded-full text-sm font-medium">
                      {currentQuestion.category}
                    </span>
                    <span className="text-amber-700 text-sm">
                      Q{currentQuestionIndex + 1}/{selectedQuestions.length}
                    </span>
                  </div>
                  <div
                    className={`flex items-center gap-2 text-2xl font-mono font-bold ${
                      getTimerColor()
                    }`}
                  >
                    ⏱️ {formatTime(timeLeft)}
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-xl p-8 mb-6">
                  <h2 className="text-2xl font-bold text-gray-800 mb-6 leading-relaxed">
                    {currentQuestion.question}
                  </h2>

                  {!isTimerRunning && timeLeft === 300 && (
                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-6">
                      <p className="text-blue-800 text-sm">
                        <strong>Tip:</strong> Take a moment to structure your thoughts,
                        then click "Start Timer" when ready. Aim for a 2-3 minute
                        response covering key frameworks and specific examples.
                      </p>
                    </div>
                  )}

                  <textarea
                    value={currentAnswer}
                    onChange={(e) => setCurrentAnswer(e.target.value)}
                    placeholder="Type your answer here... Structure your response as if you're speaking to an interviewer."
                    className="w-full h-64 p-4 border-2 border-gray-200 rounded-xl resize-none focus:border-amber-500 focus:outline-none text-gray-700"
                    disabled={timeLeft === 0}
                  />

                  <div className="flex items-center justify-between mt-6">
                    <div className="flex gap-3">
                      {!isTimerRunning ? (
                        <button
                          onClick={handleStartTimer}
                          disabled={timeLeft === 0}
                          className="flex items-center gap-2 bg-green-600 hover:bg-green-700 disabled:bg-gray-400 text-white px-6 py-3 rounded-xl font-medium transition-all"
                        >
                          ▶️ {timeLeft === 300 ? "Start Timer" : "Resume"}
                        </button>
                      ) : (
                        <button
                          onClick={handlePauseTimer}
                          className="flex items-center gap-2 bg-yellow-600 hover:bg-yellow-700 text-white px-6 py-3 rounded-xl font-medium transition-all"
                        >
                          ⏸️ Pause
                        </button>
                      )}
                    </div>
                    <button
                      onClick={handleSubmitAnswer}
                      disabled={currentAnswer.trim().length < 50}
                      className="flex items-center gap-2 bg-amber-600 hover:bg-amber-700 disabled:bg-gray-400 text-white px-8 py-3 rounded-xl font-medium transition-all"
                    >
                      Submit Answer ➡️
                    </button>
                  </div>
                  {currentAnswer.trim().length < 50 && currentAnswer.length > 0 && (
                    <p className="text-sm text-gray-500 mt-3">
                      Write at least 50 characters to submit ({currentAnswer.length}/50)
                    </p>
                  )}
                </div>

                <div className="bg-white/10 rounded-full h-2 overflow-hidden">
                  <div
                    className="bg-amber-500 h-full transition-all duration-300"
                    style={{
                      width: `${
                        ((currentQuestionIndex + 1) / selectedQuestions.length) * 100
                      }%`,
                    }}
                  />
                </div>
              </div>
            </div>
          );
        }

        if (gameState === "review") {
          const currentQuestion = selectedQuestions[currentQuestionIndex];
          return (
            <div className="min-h-screen bg-[#f6f3ee] text-slate-900 p-4">
              <div className="max-w-4xl mx-auto">
                <div className="flex items-center justify-between mb-4">
                  <button
                    onClick={handleRestart}
                    className="flex items-center gap-1 text-amber-700 hover:text-slate-900 transition-colors text-sm"
                  >
                    🏠 Home
                  </button>
                  <span className="text-amber-700 text-sm">
                    Q{currentQuestionIndex + 1}/{selectedQuestions.length}
                  </span>
                </div>
                <div className="text-center mb-6">
                  <h2 className="text-2xl font-bold text-slate-900">Review & Score</h2>
                  <p className="text-amber-700">Compare your answer to the model response</p>
                </div>

                <div className="grid md:grid-cols-2 gap-6 mb-6">
                  <div className="bg-white rounded-2xl shadow-xl p-6">
                    <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                      <div className="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <span className="text-blue-600 text-sm">You</span>
                      </div>
                      Your Answer
                    </h3>
                    <div className="bg-gray-50 rounded-xl p-4 h-48 overflow-y-auto text-gray-700 text-sm">
                      {answers[currentQuestionIndex]}
                    </div>
                  </div>
                  <div className="bg-white rounded-2xl shadow-xl p-6">
                    <h3 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                      <div className="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center">
                        ✅
                      </div>
                      Strong Answer
                    </h3>
                    <div className="bg-green-50 rounded-xl p-4 h-48 overflow-y-auto text-gray-700 text-sm">
                      {currentQuestion.sampleAnswer}
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                  <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                    ⚠️ Key Points to Hit
                  </h3>
                  <div className="grid md:grid-cols-2 gap-3">
                    {currentQuestion.keyPoints.map((point, idx) => (
                      <div key={idx} className="flex items-start gap-2 bg-amber-50 rounded-lg p-3">
                        <div className="w-5 h-5 bg-amber-200 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5">
                          <span className="text-amber-700 text-xs font-bold">{idx + 1}</span>
                        </div>
                        <span className="text-sm text-amber-900">{point}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-xl p-6">
                  <h3 className="font-bold text-gray-800 mb-4">Rate Your Answer</h3>
                  {suggestedScore !== null && (
                    <div className="mb-4">
                      <div className="text-sm text-gray-700 mb-2">
                        Suggested score:{" "}
                        <span className={`font-bold ${getScoreColor(suggestedScore)}`}>
                          {suggestedScore}/5
                        </span>
                      </div>
                      <div className="text-sm text-gray-600 bg-gray-50 p-3 rounded mb-2 whitespace-pre-wrap">
                        {suggestedExplanation}
                      </div>
                      <button
                        onClick={() => setCurrentScore(suggestedScore)}
                        className="text-sm text-amber-600 hover:underline"
                      >
                        Use suggested score
                      </button>
                    </div>
                  )}
                  <div className="flex gap-3 mb-6">
                    {[1, 2, 3, 4, 5].map((score) => (
                      <button
                        key={score}
                        onClick={() => setCurrentScore(score)}
                        className={`flex-1 py-4 rounded-xl font-bold text-lg transition-all border-2 ${
                          currentScore === score
                            ? "bg-amber-600 text-white border-amber-600"
                            : "bg-gray-50 text-gray-700 border-gray-200 hover:border-amber-300"
                        }`}
                      >
                        {score}
                      </button>
                    ))}
                  </div>
                  <div className="flex justify-between text-sm text-gray-500 mb-6 px-2">
                    <span>Missed key points</span>
                    <span>Nailed it</span>
                  </div>
                  <button
                    onClick={handleScoreSubmit}
                    disabled={currentScore === 0}
                    className="w-full bg-amber-600 hover:bg-amber-700 disabled:bg-gray-400 text-white font-semibold py-4 rounded-xl transition-all flex items-center justify-center gap-2"
                  >
                    {currentQuestionIndex < selectedQuestions.length - 1
                      ? "Next Question"
                      : "See Results"}
                    ➡️
                  </button>
                </div>
              </div>
            </div>
          );
        }

        if (gameState === "results") {
          const avgScore = getAverageScore();
          const categoryBreakdown = {};
          selectedQuestions.forEach((q, idx) => {
            if (!categoryBreakdown[q.category]) {
              categoryBreakdown[q.category] = { total: 0, sum: 0 };
            }
            categoryBreakdown[q.category].total++;
            categoryBreakdown[q.category].sum += scores[idx];
          });

          return (
            <div className="min-h-screen bg-[#f6f3ee] text-slate-900 p-4">
              <div className="max-w-4xl mx-auto">
                <div className="mb-4">
                  <button
                    onClick={handleRestart}
                    className="flex items-center gap-1 text-amber-700 hover:text-slate-900 transition-colors text-sm"
                  >
                    🏠 Home
                  </button>
                </div>
                <div className="bg-white rounded-2xl shadow-xl p-8 mb-6 text-center">
                  <div className="inline-flex items-center justify-center w-20 h-20 bg-amber-100 rounded-full mb-4 text-3xl">
                    🏆
                  </div>
                  <h1 className="text-3xl font-bold text-gray-800 mb-2">
                    Practice Complete!
                  </h1>
                  <p className="text-gray-600 mb-6">
                    Here's how you did across {selectedQuestions.length} questions
                  </p>

                  <div className="flex justify-center gap-8 mb-6">
                    <div className="text-center">
                      <div className={`text-5xl font-bold ${getScoreColor(avgScore)}`}>
                        {avgScore}
                      </div>
                      <div className="text-gray-500 text-sm mt-1">Average Score</div>
                    </div>
                    <div className="text-center">
                      <div className="text-5xl font-bold text-amber-600">
                        {scores.filter((s) => s >= 4).length}
                      </div>
                      <div className="text-gray-500 text-sm mt-1">Strong Answers</div>
                    </div>
                    <div className="text-center">
                      <div className="text-5xl font-bold text-gray-600">
                        {scores.filter((s) => s <= 2).length}
                      </div>
                      <div className="text-gray-500 text-sm mt-1">Needs Work</div>
                    </div>
                  </div>

                  <div className="bg-gray-50 rounded-xl p-4">
                    <h4 className="text-sm font-medium text-gray-700 mb-3">Score by Category</h4>
                    <div className="flex flex-wrap justify-center gap-3">
                      {Object.entries(categoryBreakdown).map(([cat, data]) => (
                        <div key={cat} className="bg-white rounded-lg px-4 py-2 border">
                          <span className="text-sm text-gray-600">{cat}</span>
                          <span className={`ml-2 font-bold ${getScoreColor(data.sum / data.total)}`}>
                            {(data.sum / data.total).toFixed(1)}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
                  <h2 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                    📈 Detailed Breakdown
                  </h2>
                  <div className="space-y-4">
                    {selectedQuestions.map((q, idx) => (
                      <div
                        key={q.id}
                        className={`border-2 rounded-xl p-4 ${getScoreBg(scores[idx])}`}
                      >
                        <div className="flex items-start justify-between gap-4 mb-3">
                          <div className="flex-1">
                            <span className="text-xs font-medium text-gray-500 uppercase tracking-wide">
                              {q.category}
                            </span>
                            <h3 className="font-semibold text-gray-800 mt-1">
                              {q.question}
                            </h3>
                          </div>
                          <div className="text-right">
                            <div className={`text-2xl font-bold ${getScoreColor(scores[idx])}`}>
                              {scores[idx]}/5
                            </div>
                            <div className="text-xs text-gray-500 mt-1">
                              Suggested:{" "}
                              <span className={getScoreColor(suggestedScores[idx] || 0)}>
                                {suggestedScores[idx] || "-"}/5
                              </span>
                            </div>
                          </div>
                        </div>
                        <div className="grid md:grid-cols-2 gap-4 mt-4">
                          <div>
                            <h4 className="text-xs font-medium text-gray-500 uppercase mb-2">
                              Your Answer
                            </h4>
                            <p className="text-sm text-gray-700 bg-white/50 rounded-lg p-3 h-32 overflow-y-auto">
                              {answers[idx]}
                            </p>
                          </div>
                          <div>
                            <h4 className="text-xs font-medium text-gray-500 uppercase mb-2">
                              Key Points
                            </h4>
                            <ul className="text-sm text-gray-700 bg-white/50 rounded-lg p-3 h-32 overflow-y-auto space-y-1">
                              {q.keyPoints.map((point, i) => (
                                <li key={i} className="flex items-start gap-2">
                                  <span className="text-amber-600">•</span>
                                  {point}
                                </li>
                              ))}
                            </ul>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex gap-4">
                  <button
                    onClick={handleRestart}
                    className="flex-1 bg-white hover:bg-gray-50 text-amber-600 font-semibold py-4 rounded-xl transition-all flex items-center justify-center gap-2 border-2 border-amber-200"
                  >
                    🔁 Practice Again (New Questions)
                  </button>
                </div>
                <p className="text-center text-amber-700 text-sm mt-4">
                  Each session gives you a fresh random selection from {allQuestions.length} questions
                </p>
              </div>
            </div>
          );
        }

        return null;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
